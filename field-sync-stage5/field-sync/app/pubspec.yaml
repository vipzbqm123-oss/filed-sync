# path: app/pubspec.yaml
name: fieldsync
description: 현장 작업 중복 방지 협업 앱 (FieldSync)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1' # flutter_local_notifications 22.x 요구

dependencies:
  # 하한 = 원본 저장소에서 존재를 확인한 버전(2026-09-23). ^ 범위라 이후 호환 버전으로 해석됨
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2 # Auth·DB·Realtime·Storage·Functions 단일 클라이언트
  kakao_map_sdk: ^1.3.1 # 카카오맵 네이티브 SDK v2 래퍼(지도·마커)
  firebase_core: ^4.12.1 # FCM 초기화
  firebase_messaging: ^16.4.3 # 원격 푸시(긴급·에스컬레이션·강제 해제)
  flutter_local_notifications: ^22.3.0 # 오프라인에서도 울리는 리마인더·상시 작업중 알림
  timezone: ^0.11.0 # zonedSchedule 필수 타입(UTC만 사용, tz DB 미로딩)
  geolocator: ^14.0.3 # 현장 도착 감지·거리순 정렬
  url_launcher: ^6.3.2 # 카카오맵 앱 길찾기·즐겨찾기 링크 열기
  image_picker: ^1.2.2 # 증빙 사진 촬영
  file_picker: ^13.1.0 # 관리자 CSV 파일 선택
  path_provider: ^2.1.5 # 오프라인 큐·캐시·미전송 사진을 앱 전용 폴더에 보관

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
